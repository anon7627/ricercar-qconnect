[package]
name = "qconnect"
version = "0.1.6"
edition = "2021"
description = "Qobuz source plugin (JSON-RPC over stdio): catalogue, sign-in, stream resolution and Qobuz Connect remote control"
license = "MIT"
build = "build.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
urlencoding = "2"
base64 = "0.22"

[build-dependencies]
prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
