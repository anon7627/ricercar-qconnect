syntax = "proto2";
package qconnect;

enum PlayingState {
  PLAYING_STATE_UNKNOWN  = 0;
  PLAYING_STATE_STOPPED  = 1;
  PLAYING_STATE_PLAYING  = 2;
  PLAYING_STATE_PAUSED   = 3;
}

enum BufferState {
  BUFFER_STATE_UNKNOWN   = 0;
  BUFFER_STATE_BUFFERING = 1;
  BUFFER_STATE_OK        = 2;
  BUFFER_STATE_ERROR     = 3;
  BUFFER_STATE_UNDERRUN  = 4;
}

enum DeviceType {
  DEVICE_TYPE_UNKNOWN    = 0;
  DEVICE_TYPE_SPEAKER    = 1;
  DEVICE_TYPE_STREAMER   = 2;
  DEVICE_TYPE_TV         = 3;
  DEVICE_TYPE_SOUNDBAR   = 4;
  DEVICE_TYPE_COMPUTER   = 5;
  DEVICE_TYPE_MOBILE     = 6;
  DEVICE_TYPE_CAST       = 7;
  DEVICE_TYPE_HEADPHONES = 8;
  DEVICE_TYPE_TABLET     = 9;
}

enum LoopMode {
  LOOP_MODE_UNKNOWN    = 0;
  LOOP_MODE_OFF        = 1;
  LOOP_MODE_REPEAT_ONE = 2;
  LOOP_MODE_REPEAT_ALL = 3;
}

message QueueVersion {
  optional uint64 major = 1;
  optional int32  minor = 2;
}

message Position {
  optional fixed64 timestamp = 1; // ms epoch
  optional uint32 value      = 2; // ms position
}

message Error {
  optional string code    = 1;
  optional string message = 2;
}

message DeviceCapabilities {
  optional int32 minAudioQuality     = 1;
  optional int32 maxAudioQuality     = 2;
  optional int32 volumeRemoteControl = 3; // 1 = NOT_ALLOWED, 2 = ALLOWED
}

message DeviceInfo {
  optional bytes  deviceUuid     = 1; // 16 bytes
  optional string friendlyName   = 2;
  optional string brand          = 3;
  optional string model          = 4;
  optional string serialNumber   = 5;
  optional DeviceType type       = 6;
  optional DeviceCapabilities capabilities = 7;
  optional string softwareVersion = 8;
}

// State of a renderer as reported to the server (RndrSrvrStateUpdated.state).
message RendererState {
  optional PlayingState playingState      = 1;
  optional BufferState  bufferState       = 2;
  optional Position     currentPosition   = 3;
  optional uint32       duration          = 4; // ms
  optional QueueVersion queueVersion      = 5;
  optional int32        currentQueueItemId = 6;
  optional int32        nextQueueItemId    = 7;
}

// Track reference with context.
message QueueTrackRef {
  optional int32    queueItemId = 1;  // -1: none
  optional fixed32  trackId     = 2;  // fixed32 on the wire
  optional bytes   contextUuid = 3; // 16 bytes
}
